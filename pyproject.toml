[project]
name = "sing-pitch"
version = "0.2.0"
description = "Live singing pitch feedback"
requires-python = ">=3.12,<3.13"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "numpy>=2.0",
    "swift-f0[audio]==0.3.0",
    "sounddevice==0.5.6",
    "pyqtgraph==0.14.0",
    "pyside6-essentials==6.12.0",
    "soundfile>=0.13",         # reads the Backing for Melody Takes
    "pylibrb==0.1.2",
    "platformdirs>=4",        # the data folder, per OS convention (config.data_dir)
]

[project.optional-dependencies]
# heavy: torch (~2 GB) + models. Only needed for song import (issue #5).
import = [
    "audio-separator[cpu]==0.48.0",
    "audioread>=3.0",          # audio-separator 0.48.0 imports it but does not declare it
    "rmvpe-onnx==0.2.3",
    "yt-dlp>=2026.10.26",
    "soundfile>=0.13",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-qt>=4.4"]

[project.scripts]
sing-pitch = "sing_pitch.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sing_pitch"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: opt-in tests that need models/network (run with -m slow)"]
addopts = "-m 'not slow'"

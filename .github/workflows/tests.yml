# The fast test suite on macOS and Windows, for every push and pull request (docs/cross-platform.md).
# No microphone or speakers: the tests run the real window offscreen on the fake audio of testmode.py.
name: tests

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false            # one OS failing still shows the other's result
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      SING_PITCH_TEST_SPEED: "1"  # CI runners are slower than an Apple Silicon Mac (tests/app_speed.py)
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.9.30"       # writes uv.lock in the format it has (revision 3); newer ones rewrite it
      - name: Install           # without the import extra: the tests use stand-ins for torch and the models
        run: uv sync --locked
      - name: Fast tests
        run: uv run pytest -rfE
